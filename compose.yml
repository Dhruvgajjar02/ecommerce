services:
  # ─────────────────────────────────────────
  # Node.js Backend — server.js on port 2999
  # ─────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clickmart_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 2999
    ports:
      - "2999:2999"
    networks:
      - clickmart_network

  # ─────────────────────────────────────────
  # React Frontend (CRA) served via Nginx
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: clickmart_frontend
    volumes:
      - ./client:/app
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - clickmart_network

# ─────────────────────────────────────────
networks:
  clickmart_network:
    driver: bridge